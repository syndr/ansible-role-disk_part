---
# Look for duplicate mounts and unmount them if they exist
# Remove mount configuration (systemd/fstab) for volume being unmounted

- name: Search for duplicate disk mounts
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/find_duplicate_mounts.yml"

- name: There be duplicate mounts! 🔪
  when:
    - __disks_duplicate_mounts | length > 0
  block:
    - name: Duplicate device mounts detected
      ansible.builtin.assert:
        that:
          - disks_allow_mountpoint_changes | default(true) is true
        fail_msg: |
          ❌ Duplicate mounts detected for device {{ __disks_device_canonical }}:
          {% for mount in __disks_duplicate_mounts %}
          • Mounted at: {{ mount }}
          {% endfor %}
          
          However, 'disks_allow_mountpoint_changes' is disabled, so automatic unmounting cannot proceed.
          Please resolve these duplicate mounts manually.
        success_msg: |
          ⚠️ Duplicate mounts detected for device {{ __disks_device_canonical }}:
          {% for mount in __disks_duplicate_mounts %}
          • Mounted at: {{ mount }}
          {% endfor %}
          
          Proceeding to unmount duplicate mount points as 'disks_allow_mountpoint_changes' is enabled.

    - name: Generate expected systemd mount unit name
      loop: "{{ __disks_duplicate_mounts }}"
      loop_control:
        loop_var: __disks_duplicate_mount
      ansible.builtin.command:
        cmd: 'systemd-escape -p --suffix=mount "{{ __disks_duplicate_mount }}"'
      register: __disks_duplicate_systemd_units
      changed_when: false

    - name: Check for systemd mount units for duplicate mounts
      loop: "{{ __disks_duplicate_systemd_units.results }}"
      loop_control:
        loop_var: __disks_unit
      become: true
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ __disks_unit.stdout | trim }}"
      register: __disks_duplicate_unit_stats

    - name: Systemd units exist
      when: __disks_duplicate_unit_stats.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Stop and disable existing systemd mount unit
          loop: "{{ __disks_duplicate_unit_stats.results | selectattr('stat.exists') | list }}"
          loop_control:
            loop_var: __disks_unit_stat
          become: true
          ansible.builtin.systemd_service:
            name: "{{ __disks_unit_stat.__disks_unit.stdout | trim }}"
            state: stopped
            enabled: false

        - name: Remove existing systemd mount unit file
          loop: "{{ __disks_duplicate_unit_stats.results | selectattr('stat.exists') | list }}"
          loop_control:
            loop_var: __disks_unit_stat
          become: true
          ansible.builtin.file:
            path: "{{ __disks_unit_stat.stat.path }}"
            state: absent
          register: __disks_duplicate_systemd_units_removal

        - name: Reload systemd daemon (units removed)
          when: __disks_duplicate_systemd_units_removal | default(false) is truthy
          become: true
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Gather system mount information
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - "mounts"

        - name: Re-evaluate duplicate mount status
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/find_duplicate_mounts.yml"

    - name: Systemd units don't exist
      when: __disks_duplicate_unit_stats.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Remove fstab mount point entry
          loop: "{{ __disks_duplicate_mounts }}"
          loop_control:
            loop_var: __disks_duplicate_mount
          become: true
          ansible.posix.mount:
            path: "{{ __disks_duplicate_mount }}"
            state: absent

        - name: Re-evaluate duplicate mount status
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/find_duplicate_mounts.yml"

    - name: Unmount duplicate mount points
      loop: "{{ __disks_duplicate_mounts }}"
      loop_control:
        loop_var: __disks_duplicate_mount
      become: true
      ansible.builtin.command:
        cmd: "umount {{ __disks_duplicate_mount }}"
      register: __disks_unmount_result

    - name: Validate unmount results
      ansible.builtin.assert:
        that:
          - __disks_unmount_result is defined
          - __disks_unmount_result.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Failed to unmount one or more duplicate mount points:
          {{ __disks_unmount_result.results
             | selectattr('rc', 'ne', 0)
             | map(attribute='stderr')
             | join('; ')
          }}
        success_msg: "✓ All duplicate mount points successfully unmounted"
