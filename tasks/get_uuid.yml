---
# Get the UUID for the current disk and update the device path
# This task should only be called for devices that exist and need UUID mounting
# LVM devices use /dev/vg-name/lv-name paths and should not be converted to UUID

- name: Get UUID for {{ disks_disk_config.device }}
  become: true
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value {{ disks_disk_config.device }}"
  register: __disks_blkid_output
  changed_when: false
  check_mode: false
  failed_when: false

- name: Validate UUID was retrieved
  ansible.builtin.assert:
    that:
      - __disks_blkid_output.rc == 0
      - __disks_blkid_output.stdout is defined
      - __disks_blkid_output.stdout | length > 0
    fail_msg: "Could not determine UUID for device {{ disks_disk_config.device }}"
    success_msg: "UUID for device {{ disks_disk_config.device }} is {{ __disks_blkid_output.stdout | trim }}"

- name: Update device path to use UUID
  ansible.builtin.set_fact:
    disks_disk_config: >-
      {{
        disks_disk_config
        | combine({
          'kernel_device': disks_disk_config.device,
          'base_device_uuid': __disks_blkid_output.stdout | trim
        })
      }}

- name: Discover LVM volume UUID
  vars:
    __disks_is_target_lv: >-
      {{ disks_disk_config.lvm is true and
         disks_disk_config.device == '/dev/vg-' + disks_disk_config.lvm_vg_name + '/lv-' + disks_disk_config.lvm_lv_name }}
  when: __disks_is_target_lv
  block:
    - name: Collect LVM LV UUID (if lvs available)
      block:
        - name: Check for lvs command
          ansible.builtin.command:
            cmd: "command -v lvs"
          register: __disks_lvs_cmd_check
          changed_when: false
          failed_when: false

        - name: Get UUID for LVM volume {{ disks_disk_config.device }}
          when: __disks_lvs_cmd_check.rc == 0
          become: true
          ansible.builtin.command:
            cmd: "lvs --noheadings -o lv_uuid {{ disks_disk_config.device }}"
          register: __disks_lvm_uuid_output
          changed_when: false
          failed_when: false

        - name: Validate and store LVM UUID
          when:
            - __disks_lvs_cmd_check.rc == 0
            - __disks_lvm_uuid_output.rc == 0
            - __disks_lvm_uuid_output.stdout is defined
            - __disks_lvm_uuid_output.stdout | length > 0
          block:
            - name: Validate LVM UUID was retrieved
              ansible.builtin.assert:
                that:
                  - __disks_lvm_uuid_output.stdout | length > 0
                fail_msg: "Could not determine LVM UUID for volume {{ disks_disk_config.device }}"
                success_msg: >-
                  LVM UUID for volume {{ disks_disk_config.device }} is {{ __disks_lvm_uuid_output.stdout | trim }}

            - name: Update device path to include LVM UUID
              ansible.builtin.set_fact:
                disks_disk_config: >-
                  {{
                    disks_disk_config
                    | combine({
                      'lvm_lv_uuid': __disks_lvm_uuid_output.stdout | trim
                    })
                  }}
