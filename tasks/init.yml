---
# Do main role initialization

- name: Reset internal variables
  ansible.builtin.set_fact:
    # List of systemd service names corresponding to disk mounts
    disks_pending_systemd_mounts: []

    # List of fstab-managed mount points that should be re-mounted
    disks_pending_fstab_mounts: []

    # Information written to local host facts at /etc/ansible/facts.d/disk_part.fact
    #  - Built during role execution
    disks_fact_data: []

- name: Validate input data
  block:
    - name: Validate partitions list
      ansible.builtin.assert:
        that:
          - disks_partitions is defined
          - disks_partitions | type_debug == 'list'
          - disks_partitions | length > 0
        fail_msg: "The 'disks_partitions' variable must be defined as a list."
        success_msg: "✓ 'disks_partitions' variable is properly defined."

    - name: Validate partition count
      vars:
        __disks_unique_devices: "{{ disks_partitions | map(attribute='device') | unique | list }}"
      ansible.builtin.assert:
        that:
          - __disks_unique_devices | length == disks_partitions | length
        fail_msg: >-
          Each partition entry must have a unique 'device' value.
          Multi-partition device configuration is not presently supported.
          Multiple entries found for:
            {{ disks_partitions
              | map(attribute='device')
              | groupby('device')
              | selectattr('1', 'length', '>', 1)
              | map(attribute='0')
              | list | join(', ')
            }}
        success_msg: "✓ All partition entries have unique 'device' values."

# Per-item validation occurs in init_disk_config.yml after defaults merge; only list-level checks kept here.
