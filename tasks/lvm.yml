---
# Configure LVM physical volumes and volume groups with partition detection and safety checks

- name: Manage a LVM volume group
  vars:
    __disks_force_enabled: >-
      {{
        disks_disk_config.force | default(false)
      }}
  block:
    - name: Check for existing volume group "{{ disks_disk_config.lvm_vg_name }}"
      become: true
      ansible.builtin.command:
        cmd: "pvs --noheadings -o pv_name -S vg_name=vg-{{ disks_disk_config.lvm_vg_name }}"
      register: __disks_existing_vg_pvs
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Ensure volume group "{{ disks_disk_config.lvm_vg_name }}" exists with proper physical volumes
      vars:
        __disks_existing_pvs: >
          {{
            (__disks_existing_vg_pvs.stdout_lines | map('trim') | list)
            if __disks_existing_vg_pvs.rc == 0 and __disks_existing_vg_pvs.stdout_lines | length > 0
            else []
          }}
        __disks_target_pvs: >
          {{
            (__disks_existing_pvs + [disks_disk_config.device]) | unique | sort
          }}
      become: true
      community.general.lvg:
        vg: "vg-{{ disks_disk_config.lvm_vg_name }}"
        pvs: "{{ __disks_target_pvs | join(',') }}"
        force: "{{ __disks_force_enabled }}"
        pvresize: "{{ disks_disk_config.lvm_pvresize | default(omit) }}"
        pv_options: "{{ disks_disk_config.lvm_pv_options | default(omit) }}"
        vg_options: "{{ disks_disk_config.lvm_vg_options | default(omit) }}"
        state: active

    - name: Ensure logical volume "{{ disks_disk_config.lvm_lv_name }}" exists
      become: true
      community.general.lvol:
        vg: "vg-{{ disks_disk_config.lvm_vg_name }}"
        lv: "lv-{{ disks_disk_config.lvm_lv_name }}"
        force: "{{ __disks_force_enabled }}"
        opts: "{{ disks_disk_config.lvm_lv_options | default(omit) }}"
        size: +{{ disks_disk_config.lvm_size_percent }}%FREE
        state: present

    - name: Update device path to point to the logical volume
      ansible.builtin.set_fact:
        disks_disk_config: >-
          {{ disks_disk_config | combine({
             'device': '/dev/vg-' + disks_disk_config.lvm_vg_name + '/lv-' + disks_disk_config.lvm_lv_name,
             'mount_uuid_path': false
          }) }}
