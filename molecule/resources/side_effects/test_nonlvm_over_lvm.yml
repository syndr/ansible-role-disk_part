---
# Test scenario: Attempt non-LVM filesystem creation over existing LVM device (should fail)
# Validates that the role prevents destructive operations when creating filesystems over LVM

- name: Test non-LVM deployment over existing LVM device (should fail)
  tags: always
  block:
    - name: Attempt to create non-LVM filesystem over existing LVM device (should fail)
      vars:
        disks_partitions:
          - device: /dev/nvme2n1
            format: ext4
            mount_path: /mnt/dangerous_test
            mount_type: fstab
            lvm: false
      ansible.builtin.include_role:
        name: disks

    - name: Fail if the role succeeded when it should have blocked non-LVM over LVM
      ansible.builtin.fail:
        msg: "Role should have failed when attempting to create non-LVM filesystem over existing LVM device"

  rescue:
    - name: Validate expected error message for LVM protection
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg is defined
          - >-
            "Device contains LVM volume groups" in ansible_failed_result.msg or
            "Device contains other LVM volume groups" in ansible_failed_result.msg or
            "Device contains an existing filesystem (LVM2_member)" in ansible_failed_result.msg or
            "already used as LVM2_member" in ansible_failed_result.msg
          - '"force" in ansible_failed_result.msg.lower()'
        fail_msg: |
          Expected error message about existing LVM/data not found.
          Actual error: {{ ansible_failed_result.msg | default('No error message') }}
        success_msg: "✓ Validation correctly blocked non-LVM creation over existing LVM device"
