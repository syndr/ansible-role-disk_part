---
# Test scenario: Change mount point for existing filesystem (should succeed)
# Validates that the role can handle mount point changes without data loss

- name: Test changing mount point for non-LVM filesystem
  tags: always
  block:
    - name: Change mount point for existing ext4 filesystem
      vars:
        disks_partitions:
          - device: /dev/nvme1n1
            format: ext4
            mount_path: /mnt/fstab_test_new  # Changed from /mnt/fstab_test
            mount_type: fstab
            lvm: false
      ansible.builtin.include_role:
        name: disks

    - name: Verify filesystem was not recreated (companion cube should exist)
      become: true
      ansible.builtin.stat:
        path: /mnt/fstab_test_new/companion_cube.txt
      register: __companion_cube_check

    - name: Ensure companion cube survived mount point change
      ansible.builtin.assert:
        that:
          - __companion_cube_check.stat.exists
        fail_msg: "Data was lost during mount point change - companion cube missing!"
        success_msg: "✓ Mount point changed successfully without data loss"

    - name: Verify old mount point is unmounted
      ansible.builtin.shell:
        cmd: "mount | grep ' /mnt/fstab_test ' || true"
      register: __old_mount_check
      changed_when: false
      check_mode: false

    - name: Ensure old mount point is not active
      ansible.builtin.assert:
        that:
          - __old_mount_check.stdout == ""
        fail_msg: "Old mount point /mnt/fstab_test is still mounted"
        success_msg: "✓ Old mount point properly unmounted"

- name: Test changing mount point for LVM filesystem
  tags: always
  block:
    - name: Change mount point for existing LVM xfs filesystem
      vars:
        disks_partitions:
          - device: /dev/nvme2n1
            format: xfs
            mount_path: /mnt/lvm_test_new  # Changed from /mnt/lvm_test
            mount_type: systemd
            lvm: true
            lvm_vg_name: data
            lvm_lv_name: data
      ansible.builtin.include_role:
        name: disks

    - name: Verify LVM filesystem was not recreated (companion cube should exist)
      become: true
      ansible.builtin.stat:
        path: /mnt/lvm_test_new/companion_cube.txt
      register: __lvm_companion_cube_check

    - name: Ensure companion cube survived LVM mount point change
      ansible.builtin.assert:
        that:
          - __lvm_companion_cube_check.stat.exists
        fail_msg: "Data was lost during LVM mount point change - companion cube missing!"
        success_msg: "✓ LVM mount point changed successfully without data loss"

    - name: Verify old LVM mount point is unmounted
      ansible.builtin.shell:
        cmd: "mount | grep ' /mnt/lvm_test ' || true"
      register: __old_lvm_mount_check
      changed_when: false
      check_mode: false

    - name: Ensure old LVM mount point is not active
      ansible.builtin.assert:
        that:
          - __old_lvm_mount_check.stdout == ""
        fail_msg: "Old LVM mount point /mnt/lvm_test is still mounted"
        success_msg: "✓ Old LVM mount point properly unmounted"

    - name: Verify systemd mount unit was updated
      become: true
      ansible.builtin.systemd:
        name: mnt-lvm_test_new.mount
        state: started
      register: __systemd_mount_check

    - name: Ensure systemd mount unit exists and is active
      ansible.builtin.assert:
        that:
          - __systemd_mount_check is not failed
        fail_msg: "Systemd mount unit was not created or is not active"
        success_msg: "✓ Systemd mount unit properly created and active"