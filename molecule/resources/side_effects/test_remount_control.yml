---
# Test scenario: Verify disks_allow_remount flag prevents automatic remounting
# Validates that when disks_allow_remount: false, configuration changes are
# applied but volumes are not automatically remounted
#
# WARNING: "fstab" tests only that test data is still accessible after config
#           not whether remount ocurred
#

- name: Test disks_allow_remount flag for systemd mounts
  tags: always
  block:
    - name: Load initial state information
      block:
        - name: Load disk_part facts
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - local

        - name: Capture initial systemd unit configuration
          become: true
          ansible.builtin.slurp:
            src: /etc/systemd/system/mnt-lvm_test.mount
          register: __test_initial_systemd_unit

        - name: Capture initial fstab configuration
          become: true
          ansible.builtin.slurp:
            src: /etc/fstab
          register: __test_initial_fstab

        - name: Capture initial mount service timestamp (to detect restarts)
          become: true
          ansible.builtin.command:
            cmd: systemctl show mnt-lvm_test.mount --property=ActiveEnterTimestamp
          register: __test_initial_timestamp
          changed_when: false

    - name: Change configuration to trigger unit file update (without remount)
      block:
        - name: Run role with remount disabled
          vars:
            disks_partitions:
              - "{{ ci_lvm_cfg | combine({
                  'device': ansible_facts.ansible_local.molecule_disks.lvm_disk,
                  'description': 'Modified description to trigger update',
                  'systemd_before': 'docker.service'
                }) }}"
              - "{{ ci_fstab_cfg | combine({
                  'device': ansible_facts.ansible_local.molecule_disks.fstab_disk,
                  'mount_options': 'defaults,noatime'
                }) }}"
            disks_allow_remount: false
          ansible.builtin.include_role:
            name: disk_part
      rescue:
        - name: Fail if role errored when remount disabled
          ansible.builtin.fail:
            msg: |
              Role failed when disks_allow_remount: false. The role should complete
              successfully even when remounting is disabled.
              Error: {{ ansible_failed_result }}

    - name: Load updated state information
      block:
        - name: Gather mount information after configuration change
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - mounts

        - name: Capture updated fstab configuration
          become: true
          ansible.builtin.slurp:
            src: /etc/fstab
          register: __test_updated_fstab

        - name: Capture final mount service timestamp (to verify no restart)
          become: true
          ansible.builtin.command:
            cmd: systemctl show mnt-lvm_test.mount --property=ActiveEnterTimestamp
          register: __test_final_timestamp
          changed_when: false

        - name: Capture updated systemd unit configuration
          become: true
          ansible.builtin.slurp:
            src: /etc/systemd/system/mnt-lvm_test.mount
          register: __test_updated_systemd_unit

        - name: Load LVM companion cube state
          become: true
          ansible.builtin.stat:
            path: /mnt/lvm_test/companion_cube.txt
          register: __lvm_companion_cube

        - name: Load fstab companion cube state
          become: true
          ansible.builtin.stat:
            path: /mnt/fstab_test/companion_cube.txt
          register: __fstab_companion_cube

    - name: Validate state data
      block:
        - name: Verify both mounts are still mounted
          ansible.builtin.assert:
            that:
              - "'/mnt/lvm_test' in (ansible_facts.mounts | map(attribute='mount') | list)"
              - "'/mnt/fstab_test' in (ansible_facts.mounts | map(attribute='mount') | list)"
            fail_msg: |
              One or more mounts are not present after configuration change.
              Current mounts: {{ ansible_facts.mounts | map(attribute='mount') | list }}
            success_msg: "✓ Both mounts remain active"

        - name: Verify systemd unit was updated
          ansible.builtin.assert:
            that:
              - __test_updated_systemd_unit.content != __test_initial_systemd_unit.content
            fail_msg: "Systemd unit file was not updated when configuration changed"
            success_msg: "✓ Systemd unit file was updated as expected"

        - name: Verify fstab was updated
          ansible.builtin.assert:
            that:
              - __test_updated_fstab.content != __test_initial_fstab.content
              - "'noatime' in (__test_updated_fstab.content | b64decode)"
            fail_msg: "Fstab was not updated when mount_options changed"
            success_msg: "✓ Fstab was updated with new mount options"

        - name: Verify systemd mount was not restarted (timestamp unchanged)
          ansible.builtin.assert:
            that:
              - __test_initial_timestamp.stdout == __test_final_timestamp.stdout
            fail_msg: |
              Systemd mount service restart detected when disks_allow_remount: false!
              Initial timestamp: {{ __test_initial_timestamp.stdout }}
              Final timestamp:   {{ __test_final_timestamp.stdout }}
            success_msg: "✓ Systemd mount service not restarted (ActiveEnterTimestamp unchanged)"

        - name: Ensure companion cube is accessible
          ansible.builtin.assert:
            that:
              - __lvm_companion_cube.stat.exists
            fail_msg: "Companion cube not accessible - filesystem integrity issue"
            success_msg: "✓ Data remained accessible (filesystem healthy)"

        - name: Validate fstab companion cube state
          ansible.builtin.assert:
            that:
              - __fstab_companion_cube.stat.exists
            fail_msg: "Companion cube not accessible - mount may have been disrupted"
            success_msg: "✓ Fstab mount data remained accessible (no remount occurred)"

    - name: Restore original configuration with remount enabled
      block:
        - name: Run role to restore config
          vars:
            disks_partitions:
              - "{{ ci_lvm_cfg | combine({
                  'device': ansible_facts.ansible_local.molecule_disks.lvm_disk
                }) }}"
              - "{{ ci_fstab_cfg | combine({
                  'device': ansible_facts.ansible_local.molecule_disks.fstab_disk
                }) }}"
            disks_allow_remount: true
          ansible.builtin.include_role:
            name: disk_part
      rescue:
        - name: Fail if role errored during restoration
          ansible.builtin.fail:
            msg: |
              Role failed when restoring original configuration.
              Error: {{ ansible_failed_result }}
