---
# Verify that the target code runs successfullly.
# Note that this playbook (converge.yml) must be idempotent!

# Check that the molecule inventory is correctly configured
- name: Fail if molecule group is missing
  hosts: localhost
  tags: always
  tasks:
    - name: Print host inventory groups
      ansible.builtin.debug:
        msg: "{{ groups }}"

    - name: Assert group existence
      ansible.builtin.assert:
        that: "'molecule' in groups"
        fail_msg: |
          molecule group was not found inside inventory groups: {{ groups }}

- name: Converge
  hosts: molecule
  vars:
    ansible_user: molecule_runner
  tasks:
    - name: Load system facts
      tags: always
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution

    - name: Add compatibility options for legacy OS
      tags: always
      when: >-
        ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2' or
        ansible_distribution == 'CentOS' and ansible_distribution_major_version == '7'
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/local/bin/python3.10

    - name: Load disks role
      # Configuration vars are specified in molecule.yml hostvars
      tags: always
      ansible.builtin.include_role:
        name: disks

    - name: Create companion cube files for data integrity testing
      tags: 
        - always
        - molecule-idempotence-notest
      become: true
      loop:
        - path: /mnt/fstab_test/companion_cube.txt
          filesystem: ext4
          mount: /mnt/fstab_test
        - path: /mnt/lvm_test/companion_cube.txt
          filesystem: xfs
          mount: /mnt/lvm_test
      loop_control:
        loop_var: cube
        label: "{{ cube.mount }}"
      ansible.builtin.copy:
        content: |
          Test data integrity marker for {{ cube.mount }}
          Created at: {{ ansible_date_time.iso8601 }}
          This companion cube should NOT be destroyed by validation tests!
          
          The enrichment center reminds you that the companion cube cannot speak.
          In the event that the companion cube does speak, please disregard its advice.
        dest: "{{ cube.path }}"
        mode: '0644'
        owner: root
        group: root
