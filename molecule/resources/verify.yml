---
# Verify that the role being tested has done what it's supposed to

- name: Verify
  hosts: molecule
  vars:
    ansible_user: molecule_runner
    ci_companion_cubes:
      - /mnt/fstab_test/companion_cube.txt
      - /mnt/lvm_test/companion_cube.txt
  tasks:
    - name: Load system facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - local

    - name: Add compatibility options for legacy OS
      when: >-
        ansible_facts.distribution == 'Amazon' and ansible_facts.distribution_major_version == '2' or
        ansible_facts.distribution == 'CentOS' and ansible_facts.distribution_major_version == '7'
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/local/bin/python3.10

    - name: Load discovered disk configuration
      ansible.builtin.set_fact:
        disks_partitions:
          - device: "{{ ansible_facts.ansible_local.molecule_disks.fstab_disk }}"
            format: ext4
            lvm: false
            mount_path: /mnt/fstab_test
            mount_type: fstab
          - device: "{{ ansible_facts.ansible_local.molecule_disks.lvm_disk }}"
            format: xfs
            lvm: true
            mount_path: /mnt/lvm_test
            mount_type: systemd

    - name: Gather current mount information
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - mounts

    - name: Verify mount points exist for configured partitions
      when: 
        - disks_partitions is defined
        - disks_partitions | length > 0
      loop: "{{ disks_partitions }}"
      loop_control:
        loop_var: disk_config
        label: "{{ disk_config.mount_path | default('no mount path') }}"
      vars:
        # Find matching mount from ansible facts
        matching_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', disk_config.mount_path) | first | default({}) }}"
      ansible.builtin.assert:
        that:
          - matching_mount | length > 0
        fail_msg: |
          Mount point {{ disk_config.mount_path }} is not mounted!
          Expected: {{ disk_config.mount_path }}
          Current mounts: {{ ansible_facts.mounts | map(attribute='mount') | list }}
        success_msg: "✓ Mount point {{ disk_config.mount_path }} is properly mounted"

    - name: Verify filesystem types for configured partitions
      when:
        - disks_partitions is defined
        - disks_partitions | length > 0
      loop: "{{ disks_partitions }}"
      loop_control:
        loop_var: disk_config
        label: "{{ disk_config.mount_path | default('no mount path') }}"
      vars:
        matching_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', disk_config.mount_path) | first | default({}) }}"
        expected_format: "{{ disk_config.format | default('ext4') }}"
      ansible.builtin.assert:
        that:
          - matching_mount.fstype == expected_format
        fail_msg: |
          Filesystem type mismatch for {{ disk_config.mount_path }}:
          Expected: {{ expected_format }}
          Actual: {{ matching_mount.fstype | default('not found') }}
        success_msg: "✓ Filesystem {{ expected_format }} verified for {{ disk_config.mount_path }}"

    - name: Verify device mappings for configured partitions
      when:
        - disks_partitions is defined
        - disks_partitions | length > 0
      loop: "{{ disks_partitions }}"
      loop_control:
        loop_var: disk_config
        label: "{{ disk_config.mount_path | default('no mount path') }}"
      vars:
        matching_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', disk_config.mount_path) | first | default({}) }}"
        is_lvm: "{{ disk_config.lvm | default(false) }}"
        use_uuid: "{{ disk_config.mount_uuid_path | default(false) }}"
        vg_name: "{{ disk_config.lvm_vg_name | default('data') }}"
        lv_name: "{{ disk_config.lvm_lv_name | default('data') }}"
        expected_symlink: "/dev/vg-{{ vg_name }}/lv-{{ lv_name }}"
        expected_mapper: "/dev/mapper/vg--{{ vg_name }}-lv--{{ lv_name }}"
        valid_devices: >-
          {%- if is_lvm -%}
            {{ [expected_symlink, expected_mapper] }}
          {%- else -%}
            {{ [disk_config.device] }}
          {%- endif -%}
      ansible.builtin.assert:
        that:
          - >-
            (
              matching_mount.device is match('/dev/disk/by-uuid/.*')) if use_uuid else (matching_mount.device is match('/dev/disk/by-id/.*')
              or
              matching_mount.device in valid_devices
            )
        fail_msg: |
          Device mismatch for {{ disk_config.mount_path }}:
          Expected: {{ '/dev/disk/by-uuid/...' if use_uuid else ('/dev/disk/by-id/... or ' + (valid_devices | to_json)) }}
          Actual: {{ matching_mount.device | default('not found') }}
          LVM enabled: {{ is_lvm }}
          UUID enabled: {{ use_uuid }}
        success_msg: "✓ Device {{ matching_mount.device }} correctly mapped to {{ disk_config.mount_path }}"

    - name: Get all volume groups for LVM verification
      when: 
        - disks_partitions is defined
        - disks_partitions | selectattr('lvm', 'defined') | selectattr('lvm', 'equalto', true) | list | length > 0
      become: true
      ansible.builtin.command:
        cmd: "vgs --noheadings -o vg_name,pv_count"
      register: all_vgs
      changed_when: false
      failed_when: false

    - name: Verify LVM volume groups exist
      when:
        - disks_partitions is defined
        - all_vgs is defined and all_vgs.rc == 0
        - disks_partitions | selectattr('lvm', 'defined') | selectattr('lvm', 'equalto', true) | list | length > 0
      loop: >-
        {{
          disks_partitions
          | selectattr('lvm', 'defined')
          | selectattr('lvm', 'equalto', true)
          | map(attribute='lvm_vg_name', default='data')
          | unique
          | list
        }}
      loop_control:
        loop_var: vg_name
      vars:
        expected_vg: "vg-{{ vg_name }}"
      ansible.builtin.assert:
        that:
          - expected_vg in all_vgs.stdout
        fail_msg: |
          Expected LVM volume group '{{ expected_vg }}' not found!
          Available VGs: {{ all_vgs.stdout_lines }}
        success_msg: "✓ LVM volume group '{{ expected_vg }}' exists"

    - name: Verify basic disk health and accessibility
      block:
        - name: Check disk space on all mount points
          ansible.builtin.setup:
            gather_subset:
              - "!all" 
              - mounts

        - name: Verify mount points have reasonable free space
          loop: "{{ ansible_facts.mounts | selectattr('mount', 'match', '^/mnt/.*') | list }}"
          loop_control:
            loop_var: mount_info
            label: "{{ mount_info.mount }}"
          ansible.builtin.assert:
            that:
              - mount_info.size_available > 0
            fail_msg: |
              No free space available on {{ mount_info.mount }}:
              Total: {{ (mount_info.size_total / 1024 / 1024) | round(1) }} MB
              Used: {{ ((mount_info.size_total - mount_info.size_available) / 1024 / 1024) | round(1) }} MB
              Free: {{ (mount_info.size_available / 1024 / 1024) | round(1) }} MB
            success_msg: "✓ {{ mount_info.mount }} has {{ (mount_info.size_available / 1024 / 1024) | round(1) }} MB free space"

    - name: Create verification test files
      when: disks_partitions is defined
      block:
        - name: Write test files to verify write access
          become: true
          loop: "{{ disks_partitions }}"
          loop_control:
            loop_var: disk_config
            label: "{{ disk_config.mount_path | default('no mount path') }}"
          ansible.builtin.copy:
            content: |
              Disk verification test file
              Mount: {{ disk_config.mount_path }}
              Device: {{ disk_config.device }}
              Format: {{ disk_config.format | default('ext4') }}
              LVM: {{ disk_config.lvm | default(true) }}
              Created: {{ ansible_facts.date_time.iso8601 }}
            dest: "{{ disk_config.mount_path }}/verify_test.txt"
            mode: '0644'

        - name: Verify test files can be read
          loop: "{{ disks_partitions }}"
          loop_control:
            loop_var: disk_config
            label: "{{ disk_config.mount_path | default('no mount path') }}"
          ansible.builtin.stat:
            path: "{{ disk_config.mount_path }}/verify_test.txt"
          register: test_files

        - name: Confirm all test files exist and are accessible
          ansible.builtin.assert:
            that:
              - test_files.results | selectattr('stat.exists', 'equalto', true) | list | length == (disks_partitions | length)
            fail_msg: "Not all test files could be created/accessed"
            success_msg: "✓ All disk mount points are writable and accessible"

    - name: Verify companion cube data integrity
      tags: verification
      ansible.builtin.include_tasks:
        file: checks/verify_data_integrity.yml

    - name: Check for duplicate mounts
      tags: verification
      ansible.builtin.include_tasks:
        file: checks/check_duplicate_mounts.yml

    - name: Display disk configuration summary
      ansible.builtin.debug:
        msg: |
          ============================================
          DISK CONFIGURATION VERIFICATION COMPLETE
          ============================================
          {% if disks_partitions is defined %}
          Configured partitions: {{ disks_partitions | length }}
          {% for config in disks_partitions %}
          
          {{ loop.index }}. {{ config.mount_path }}:
             Device: {{ config.device }}
             Format: {{ config.format | default('ext4') }}
             LVM: {{ config.lvm | default(true) }}
             {% if config.lvm | default(true) %}
             VG: vg-{{ config.lvm_vg_name | default('data') }}
             LV: lv-{{ config.lvm_lv_name | default('data') }}
             {% endif %}
          {% endfor %}
          {% else %}
          No disks_partitions configuration found in hostvars
          {% endif %}
          
          Total active mounts: {{ ansible_facts.mounts | selectattr('mount', 'match', '^/mnt/.*') | list | length }}
          Companion cubes verified: {{ ci_companion_cubes | default([]) | length }}
          ============================================
