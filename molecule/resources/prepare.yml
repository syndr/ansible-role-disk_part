---

- name: Prepare controller for execution
  hosts: localhost
  tags: always
  tasks:
    - name: Configure for standalone role testing
      ansible.builtin.include_role:
        name: syndr.molecule.prepare_controller
      vars:
        prepare_controller_project_type: role

- name: Prepare target host for execution
  hosts: molecule
  tags: always
  tasks:
    ##
    # Creating an admin service account for Molecule/Ansible to use for testing
    #
    #   - If you run Ansible as a service account (you should) on your hosts and
    #     not as root, it is wise to also test as a non-root user!
    #
    #   - To use this account, add the following to any plays targeting test
    #     infrastructure (such as in converge.yml):
    #
    #         vars:
    #           ansible_user: molecule_runner
    ##

    - name: Create ansible service account
      vars:
        molecule_user: molecule_runner
      become: true
      block:
        - name: Create ansible group
          ansible.builtin.group:
            name: "{{ molecule_user }}"

        - name: Create ansible user
          ansible.builtin.user:
            name: "{{ molecule_user }}"
            group: "{{ molecule_user }}"
            shell: /bin/bash

        - name: Sudoers.d directory exists
          ansible.builtin.file:
            path: /etc/sudoers.d
            state: directory
            owner: root
            group: root
            mode: 0751

        - name: Ansible user has sudo
          ansible.builtin.copy:
            content: |
              {{ molecule_user }}  ALL=(ALL)  NOPASSWD: ALL
            dest: /etc/sudoers.d/ansible
            owner: root
            group: root
            mode: 0600

    - name: Get OS type
      ansible.builtin.setup:
        filter:
          - ansible_distribution*

    - name: Install package prerequisites (Fedora)
      become: true
      when: ansible_distribution | lower == 'fedora'
      ansible.builtin.package:
          name:
            - procps-ng
            - chrony
            - openssh-server

    - name: Install standalone python interpreter (AL2)
      when: ansible_distribution == "Amazon" and ansible_distribution_major_version == "2"
      ansible.builtin.include_role:
        name: python_standalone

    - name: Perform system prep (Rocky)
      become: true
      when: ansible_distribution == "Rocky"
      block:
        # This fails to start in the docker container for some reason
        - name: Disable getty service (Rocky)
          ansible.builtin.systemd_service:
            name: getty@tty1

    - name: Discover test data disks
      become: true
      block:
        - name: Get list of block devices
          ansible.builtin.command:
            cmd: lsblk -ndo NAME,SIZE,TYPE
          register: __molecule_lsblk_output
          changed_when: false

        - name: Parse available data disks (1GB, type disk)
          ansible.builtin.set_fact:
            __molecule_available_disks: >-
              {{
                __molecule_lsblk_output.stdout_lines
                | select('search', '1G.*disk')
                | map('regex_replace', '^(\S+).*', '/dev/\1')
                | list
              }}

        - name: Validate we have enough disks for testing
          ansible.builtin.assert:
            that:
              - __molecule_available_disks | length >= 4
            fail_msg: "Need at least 4 x 1GB disks for testing, found {{ __molecule_available_disks | length }}"
            success_msg: "Found {{ __molecule_available_disks | length }} data disks for testing"

        - name: Display discovered disks
          ansible.builtin.debug:
            msg: "Discovered data disks: {{ __molecule_available_disks }}"

        - name: Ensure ansible facts directory exists
          ansible.builtin.file:
            path: /etc/ansible/facts.d
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Save discovered disk mapping to local facts
          ansible.builtin.copy:
            content: |
              {
                "fstab_disk": "{{ __molecule_available_disks[0] }}",
                "lvm_disk": "{{ __molecule_available_disks[1] }}",
                "uuid_disk": "{{ __molecule_available_disks[2] }}",
                "id_disk": "{{ __molecule_available_disks[3] }}"
              }
            dest: /etc/ansible/facts.d/molecule_disks.fact
            owner: root
            group: root
            mode: '0644'

        - name: Reload ansible facts to pick up disk mapping
          ansible.builtin.setup:
            gather_subset:
              - '!all'
              - '!min'
              - local
